name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          cache: 'pip' # Caches dependencies to speed up future runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install testing dependencies explicitly just in case they aren't in requirements.txt
          pip install pytest pytest-asyncio httpx fakeredis aiosqlite

      - name: Run Pytest
        run: |
          # Run tests with short traceback, disable warnings, and output a concise report
          pytest --tb=short --disable-warnings -v