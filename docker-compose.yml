version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mfa_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: mfa_bootcamp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mfa_redis
    restart: always
    ports:
      - "6379:6379"
    # The 'appendonly yes' command ensures Redis saves state to disk,
    # fulfilling the "survive a restart" bootcamp requirement!
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: